name: Modifying

on:
  push:
    branches: [ main ]

jobs: 
  run:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python
      uses: actions/setup-python@v1
      with:
        python-version: '3.x'
    - name: Script Run
      run: |
        mv "./subjects/semester-7-subjects/pm-lab/Lec4 - Queueing Theory Fundementals.pptx" "./subjects/semester-7-subjects/pm/Lec4 - Queueing Theory Fundementals.pptx"
        rm -d ./subjects/semester-esd-lab-subjects/7
        rm -d ./subjects/semester-pm-subjects/7
        
    - name: Commit files
      id: commit
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "github-actions"
        git add --all
        if [ -z "$(git status --porcelain)" ]; then
           echo "::set-output name=push::false"
        else
           git commit -m "Add changes" -a
           echo "::set-output name=push::true"
        fi
      shell: bash
    - name: Push changes
      if: steps.commit.outputs.push == 'true'
      uses: ad-m/github-push-action@master
      with:
         github_token: ${{ secrets.GITHUB_TOKEN }}
